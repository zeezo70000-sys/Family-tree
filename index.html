
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شجرة العائلة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0e4;color:#263b2c;font-family:Tahoma,Arial}
header{background:#183b2b;color:#f5e5b4;padding:25px 12px;text-align:center;border-bottom:4px solid #bd9a4a}
header h1{margin:5px;font-size:29px}
main{max-width:950px;margin:auto;padding:18px}
.card{background:#fffdf7;border:1px solid #d8c99f;border-radius:15px;padding:18px;margin:15px 0;box-shadow:0 5px 18px #49391b12}
h2{color:#244a35}
.families{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.family{background:#204633;color:#fff1c5;padding:25px 10px;border-radius:13px;text-align:center;cursor:pointer;border:2px solid #c5a65b}
.family h2{color:#fff1c5}
.family:hover{background:#396447}
input,textarea,select{width:100%;padding:13px;border:1px solid #cdbd91;border-radius:9px;margin:8px 0;font:inherit;background:white}
button{background:#244b35;color:white;border:0;padding:12px 18px;border-radius:9px;cursor:pointer;font:inherit;margin:5px}
button.alt{background:#9b7838}
button.danger{background:#9b3939}
.person{background:#fffaf0;border:1px solid #c6ad70;border-radius:12px;padding:15px;margin:12px auto;max-width:540px;text-align:center}
.person img{width:90px;height:90px;object-fit:cover;border-radius:50%;display:block;margin:8px auto}
.children{border-right:2px solid #b79a53;margin-right:20px;padding-right:15px}
.hidden{display:none}
small{color:#786c54}
#message,#loginMsg{white-space:pre-wrap;color:#9b3939}
.actions{margin-top:10px}
</style>
</head>
<body>

<header>
<h1>شجرة العائلة</h1>
<p>بيت اليزيدي | بيت عيال علي القحطاني | بيت القحطاني</p>
</header>

<main>
<section class="card" id="home">
<h2>مرحبًا بكم في شجرة العائلة</h2>
<p>اختر العائلة للدخول إلى شجرتها.</p>
<div class="families">
<div class="family" onclick="choose('yazidi','بيت اليزيدي')">
<h2>بيت اليزيدي</h2><p>عرض شجرة العائلة</p>
</div>
<div class="family" onclick="choose('awlad-ali','بيت عيال علي القحطاني')">
<h2>بيت عيال علي القحطاني</h2><p>عرض شجرة العائلة</p>
</div>
<div class="family" onclick="choose('qahtani','بيت القحطاني')">
<h2>بيت القحطاني</h2><p>عرض شجرة العائلة</p>
</div>
</div>
</section>

<section class="card hidden" id="login">
<button class="alt" onclick="show('home')">رجوع</button>
<h2 id="loginTitle">تسجيل الدخول</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<p id="loginMsg"></p>
</section>

<section class="card hidden" id="dashboard">
<button class="alt" onclick="logout()">تسجيل الخروج</button>
<h2 id="familyTitle"></h2>
<input id="search" placeholder="ابحث عن اسم..." oninput="render()">
<button class="alt" onclick="load()">تحديث الشجرة</button>

<div id="admin" class="hidden">
<hr>
<h2>إضافة فرد جديد</h2>
<input id="name" placeholder="اسم الشخص">
<input id="info" placeholder="معلومات إضافية">
<label>اختر الأب (اختياري)</label>
<select id="parent">
<option value="">بدون أب (فرد رئيسي)</option>
</select>
<label>صورة الشخص (اختياري)</label>
<input id="photo" type="file" accept="image/*">
<button onclick="addPerson()">إضافة الفرد</button>
</div>

<div id="tree"></div>
<p id="message"></p>
</section>
</main>

<script>
const URL="https://gvtpsggcjuysqgwrizsv.supabase.co";
const KEY="sb_publishable_tS4KWCeLwkmBmWF_ZWOv5g_LzejuT4f";
const BUCKET="family-photos";
const db=window.supabase.createClient(URL,KEY);

let family="";
let familyName="";
let role="";
let people=[];
let liveChannel=null;
let renderVersion=0;

function show(id){
 ["home","login","dashboard"].forEach(x=>
  document.getElementById(x).classList.add("hidden")
 );
 document.getElementById(id).classList.remove("hidden");
}

function choose(id,name){
 family=id;
 familyName=name;
 document.getElementById("loginTitle").textContent="الدخول إلى "+name;
 document.getElementById("loginMsg").textContent="";
 document.getElementById("email").value="";
 document.getElementById("password").value="";
 show("login");
}

function loginMessage(t){
 document.getElementById("loginMsg").textContent=t;
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email||!password){
  loginMessage("اكتب البريد الإلكتروني وكلمة المرور.");
  return;
 }

 loginMessage("جارٍ تسجيل الدخول...");

 const result=await db.auth.signInWithPassword({email,password});

 if(result.error){
  loginMessage("تعذر تسجيل الدخول: "+result.error.message);
  return;
 }

 const membership=await db
  .from("family_members")
  .select("family_id,role")
  .eq("user_id",result.data.user.id)
  .single();

 if(membership.error){
  await db.auth.signOut();
  loginMessage("لم يتم العثور على صلاحية لهذا الحساب.");
  return;
 }

 role=membership.data.role;

 if(role!=="admin" && membership.data.family_id!==family){
  await db.auth.signOut();
  loginMessage("هذا الحساب لا يملك صلاحية دخول هذه العائلة.");
  return;
 }

 document.getElementById("admin").classList.toggle("hidden",role!=="admin");
 document.getElementById("familyTitle").textContent=familyName;
 document.getElementById("message").textContent="";
 document.getElementById("search").value="";
 show("dashboard");

 await load();
 subscribeRealtime();
}

async function logout(){
 if(liveChannel){
  await db.removeChannel(liveChannel);
  liveChannel=null;
 }
 await db.auth.signOut();
 people=[];
 role="";
 family="";
 show("home");
}

async function load(){
 document.getElementById("message").textContent="جارٍ تحميل الشجرة...";

 const result=await db
  .from("people")
  .select("*")
  .eq("family_id",family)
  .order("name");

 if(result.error){
  document.getElementById("message").textContent=
   "خطأ في تحميل البيانات: "+result.error.message;
  return;
 }

 people=result.data||[];

 const parentSelect=document.getElementById("parent");
 parentSelect.innerHTML='<option value="">بدون أب (فرد رئيسي)</option>';

 people.forEach(person=>{
  const option=document.createElement("option");
  option.value=person.id;
  option.textContent=person.name;
  parentSelect.appendChild(option);
 });

 document.getElementById("message").textContent="";
 await render();
}

function hasMatch(person,query,visited=new Set()){
 if(visited.has(person.id))return false;
 visited.add(person.id);

 if(
  person.name.toLowerCase().includes(query)||
  (person.info||"").toLowerCase().includes(query)
 )return true;

 return people
  .filter(child=>child.parent_id===person.id)
  .some(child=>hasMatch(child,query,new Set(visited)));
}

async function render(){
 const version=++renderVersion;
 const query=document.getElementById("search").value.trim().toLowerCase();
 const tree=document.getElementById("tree");
 tree.innerHTML="";

 if(!people.length){
  tree.textContent="لا توجد أسماء مضافة لهذه العائلة حتى الآن.";
  return;
 }

 async function branch(parent,box,level){
  const members=people.filter(p=>(p.parent_id||null)===parent);

  for(const p of members){
   if(query&&!hasMatch(p,query))continue;
   if(version!==renderVersion)return;

   const card=document.createElement("div");
   card.className="person";
   card.style.marginRight=(level*12)+"px";

   if(p.photo_path){
    const photo=await db.storage.from(BUCKET).createSignedUrl(p.photo_path,3600);
    if(photo.data?.signedUrl){
     const img=document.createElement("img");
     img.src=photo.data.signedUrl;
     img.alt="صورة "+p.name;
     card.appendChild(img);
    }
   }

   const title=document.createElement("strong");
   title.textContent=p.name;
   card.appendChild(title);

   if(p.info){
    const info=document.createElement("p");
    info.textContent=p.info;
    card.appendChild(info);
   }

   if(role==="admin"){
    const actions=document.createElement("div");
    actions.className="actions";

    const edit=document.createElement("button");
    edit.className="alt";
    edit.textContent="تعديل";
    edit.onclick=()=>editPerson(p.id);

    const del=document.createElement("button");
    del.className="danger";
    del.textContent="حذف";
    del.onclick=()=>removePerson(p.id);

    actions.append(edit,del);
    card.appendChild(actions);
   }

   box.appendChild(card);

   const children=people.filter(c=>c.parent_id===p.id);
   if(children.length){
    const childBox=document.createElement("div");
    childBox.className="children";
    box.appendChild(childBox);
    await branch(p.id,childBox,level+1);
   }
  }
 }

 await branch(null,tree,0);

 if(version===renderVersion&&!tree.innerHTML){
  tree.textContent="لا توجد أسماء مطابقة للبحث.";
 }
}

async function addPerson(){
 const name=document.getElementById("name").value.trim();
 const info=document.getElementById("info").value.trim();
 const parent=document.getElementById("parent").value||null;
 const file=document.getElementById("photo").files[0];

 if(!name){
  alert("اكتب اسم الشخص أولاً.");
  return;
 }

 const row={
  family_id:family,
  parent_id:parent,
  name:name,
  info:info
 };

 let uploadedPath=null;

 if(file){
  const extension=(file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"");
  uploadedPath=family+"/"+crypto.randomUUID()+"."+extension;

  const upload=await db.storage.from(BUCKET).upload(uploadedPath,file);

  if(upload.error){
   alert("تعذر رفع الصورة: "+upload.error.message);
   return;
  }

  row.photo_path=uploadedPath;
 }

 const result=await db.from("people").insert(row);

 if(result.error){
  if(uploadedPath){
   await db.storage.from(BUCKET).remove([uploadedPath]);
  }
  alert("تعذرت إضافة الشخص: "+result.error.message);
  return;
 }

 document.getElementById("name").value="";
 document.getElementById("info").value="";
 document.getElementById("photo").value="";
 await load();
}

async function editPerson(id){
 const person=people.find(p=>p.id===id);
 if(!person)return;

 const name=prompt("عدّل الاسم:",person.name);
 if(name===null)return;
 if(!name.trim()){
  alert("الاسم لا يمكن أن يكون فارغاً.");
  return;
 }

 const info=prompt("عدّل المعلومات:",person.info||"");
 if(info===null)return;

 const result=await db
  .from("people")
  .update({name:name.trim(),info:info.trim()})
  .eq("id",id);

 if(result.error){
  alert("تعذر التعديل: "+result.error.message);
  return;
 }

 await load();
}

async function removePerson(id){
 const person=people.find(p=>p.id===id);
 if(!person)return;

 const hasChildren=people.some(p=>p.parent_id===id);
 if(hasChildren){
  alert("لا يمكن حذف هذا الشخص قبل معالجة الأبناء المرتبطين به.");
  return;
 }

 if(!confirm("هل تريد حذف "+person.name+"؟"))return;

 const result=await db.from("people").delete().eq("id",id);

 if(result.error){
  alert("تعذر الحذف: "+result.error.message);
  return;
 }

 if(person.photo_path){
  await db.storage.from(BUCKET).remove([person.photo_path]);
 }

 await load();
}

function subscribeRealtime(){
 if(liveChannel){
  db.removeChannel(liveChannel);
  liveChannel=null;
 }

 liveChannel=db
  .channel("family-tree-"+family)
  .on(
   "postgres_changes",
   {
    event:"*",
    schema:"public",
    table:"people",
    filter:"family_id=eq."+family
   },
   async ()=>{
    await load();
   }
  )
  .subscribe();
}
</script>
</body>
</html>
