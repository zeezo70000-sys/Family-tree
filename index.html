
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شجرة العائلة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0e4;color:#263b2c;font-family:Tahoma,Arial}
header{background:#183b2b;color:#f5e5b4;padding:27px 12px;text-align:center;border-bottom:4px solid #bd9a4a}
header h1{font-size:29px;margin:5px}
header p{line-height:1.8}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:#fffdf7;border:1px solid #d8c99f;border-radius:16px;padding:19px;margin:15px 0;box-shadow:0 5px 18px #49391b12}
h2{color:#244a35}
.families{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.family{background:#204633;color:#fff1c5;padding:25px 12px;border-radius:13px;text-align:center;cursor:pointer;border:2px solid #c5a65b}
.family h2{color:#fff1c5}
.family:hover{background:#396447}
input,textarea,select{width:100%;padding:13px;border:1px solid #cdbd91;border-radius:9px;margin:8px 0;font:inherit;background:white}
textarea{min-height:75px;resize:vertical}
button{background:#244b35;color:white;border:0;padding:12px 17px;border-radius:9px;cursor:pointer;font:inherit;margin:5px}
button.alt{background:#9b7838}
button.danger{background:#9b3939}
button:disabled{opacity:.5;cursor:wait}
.hidden{display:none!important}
.person{background:#fffaf0;border:1px solid #c6ad70;border-radius:13px;padding:15px;margin:12px auto;max-width:570px;text-align:center}
.person img{width:95px;height:95px;object-fit:cover;border-radius:50%;display:block;margin:8px auto;border:3px solid #d5bd7e}
.children{border-right:2px solid #b79a53;margin-right:18px;padding-right:14px}
.actions{margin-top:12px}
.muted{color:#786c54;font-size:13px}
.message{white-space:pre-wrap;padding:10px 0;color:#9b3939}
.success{color:#27643b}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar button{flex:1}
hr{border:0;border-top:1px solid #dfd2ad;margin:22px 0}
footer{text-align:center;color:#81775f;padding:25px;font-size:13px}
</style>
</head>
<body>

<header>
<h1>شجرة العائلة</h1>
<p>بيت اليزيدي | بيت عيال علي القحطاني | بيت القحطاني</p>
</header>

<main>

<section class="card" id="home">
<h2>مرحبًا بكم في شجرة العائلة</h2>
<p>اختر العائلة التي تريد الدخول إليها.</p>
<div class="families">
<button class="family" data-family="yazidi" data-name="بيت اليزيدي">
<h2>بيت اليزيدي</h2><p>عرض شجرة العائلة</p>
</button>
<button class="family" data-family="awlad-ali" data-name="بيت عيال علي القحطاني">
<h2>بيت عيال علي القحطاني</h2><p>عرض شجرة العائلة</p>
</button>
<button class="family" data-family="qahtani" data-name="بيت القحطاني">
<h2>بيت القحطاني</h2><p>عرض شجرة العائلة</p>
</button>
</div>
</section>

<section class="card hidden" id="login">
<button class="alt" id="backHome">رجوع</button>
<h2 id="loginTitle">تسجيل الدخول</h2>
<label>البريد الإلكتروني</label>
<input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني">
<label>كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
<button id="loginButton">دخول</button>
<p id="loginMsg" class="message"></p>
</section>

<section class="card hidden" id="dashboard">
<div class="toolbar">
<button class="alt" id="logoutButton">تسجيل الخروج</button>
<button class="alt" id="refreshButton">تحديث الشجرة</button>
</div>

<h2 id="familyTitle"></h2>

<div id="adminTools" class="hidden">
<hr>
<h2>إدارة العائلات</h2>
<label>اختر العائلة التي تريد إدارتها</label>
<select id="adminFamily">
<option value="yazidi">بيت اليزيدي</option>
<option value="awlad-ali">بيت عيال علي القحطاني</option>
<option value="qahtani">بيت القحطاني</option>
</select>

<hr>
<h2 id="formTitle">إضافة فرد جديد</h2>
<input id="personName" placeholder="اسم الشخص">
<textarea id="personInfo" placeholder="معلومات إضافية (اختياري)"></textarea>
<label>الأب</label>
<select id="parentSelect">
<option value="">بدون أب (فرد رئيسي)</option>
</select>
<label>صورة الشخص (اختياري)</label>
<input id="personPhoto" type="file" accept="image/*">
<div class="toolbar">
<button id="savePerson">إضافة الفرد</button>
<button class="alt hidden" id="cancelEdit">إلغاء التعديل</button>
</div>
<p class="muted">يمكنك إضافة الأسماء وربط كل شخص بأبيه وتعديل معلوماته لاحقًا.</p>
</div>

<hr>
<h2>أفراد العائلة</h2>
<input id="search" placeholder="ابحث بالاسم أو المعلومات...">
<p id="status" class="message"></p>
<div id="tree"></div>
</section>

</main>

<footer>شجرة العائلة</footer>

<script>
const SUPABASE_URL="https://gvtpsggcjuysqgwrizsv.supabase.co";
const SUPABASE_KEY="sb_publishable_tS4KWCeLwkmBmWF_ZWOv5g_LzejuT4f";
const BUCKET="family-photos";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const families={
 "yazidi":"بيت اليزيدي",
 "awlad-ali":"بيت عيال علي القحطاني",
 "qahtani":"بيت القحطاني"
};

let family="";
let familyName="";
let role="";
let people=[];
let editingId=null;
let realtimeChannel=null;
let loading=false;
let renderNumber=0;

const el=id=>document.getElementById(id);

function showPage(page){
 ["home","login","dashboard"].forEach(id=>el(id).classList.add("hidden"));
 el(page).classList.remove("hidden");
}

function setStatus(message,success=false){
 el("status").textContent=message;
 el("status").className=success?"message success":"message";
}

function loginMessage(message){
 el("loginMsg").textContent=message;
}

document.querySelectorAll("[data-family]").forEach(button=>{
 button.addEventListener("click",()=>{
  family=button.dataset.family;
  familyName=button.dataset.name;
  el("loginTitle").textContent="الدخول إلى "+familyName;
  el("email").value="";
  el("password").value="";
  loginMessage("");
  showPage("login");
 });
});

el("backHome").addEventListener("click",()=>showPage("home"));

async function login(){
 if(loading)return;
 const email=el("email").value.trim();
 const password=el("password").value;

 if(!email||!password){
  loginMessage("اكتب البريد الإلكتروني وكلمة المرور.");
  return;
 }

 loading=true;
 el("loginButton").disabled=true;
 loginMessage("جارٍ تسجيل الدخول...");

 try{
  const result=await db.auth.signInWithPassword({email,password});
  if(result.error)throw result.error;

  const membership=await db.from("family_members")
   .select("family_id,role")
   .eq("user_id",result.data.user.id)
   .single();

  if(membership.error)throw new Error("لم يتم العثور على صلاحية لهذا الحساب.");

  role=membership.data.role;

  if(role!=="admin"&&membership.data.family_id!==family){
   await db.auth.signOut();
   throw new Error("هذا الحساب لا يملك صلاحية دخول هذه العائلة.");
  }

  el("adminTools").classList.toggle("hidden",role!=="admin");

  if(role==="admin"){
   el("adminFamily").value=family;
  }

  updateFamilyTitle();
  showPage("dashboard");
  await loadPeople();
  subscribeRealtime();

 }catch(error){
  loginMessage("تعذر الدخول: "+(error.message||"خطأ غير معروف"));
 }finally{
  loading=false;
  el("loginButton").disabled=false;
 }
}

el("loginButton").addEventListener("click",login);

el("password").addEventListener("keydown",e=>{
 if(e.key==="Enter")login();
});

function updateFamilyTitle(){
 familyName=families[family]||familyName;
 el("familyTitle").textContent=familyName;
}

el("adminFamily").addEventListener("change",async()=>{
 if(role!=="admin")return;
 family=el("adminFamily").value;
 updateFamilyTitle();
 resetForm();
 await loadPeople();
 subscribeRealtime();
});

async function logout(){
 if(realtimeChannel){
  await db.removeChannel(realtimeChannel);
  realtimeChannel=null;
 }
 await db.auth.signOut();
 people=[];
 role="";
 family="";
 editingId=null;
 showPage("home");
}

el("logoutButton").addEventListener("click",logout);

el("refreshButton").addEventListener("click",loadPeople);

async function loadPeople(){
 setStatus("جارٍ تحميل بيانات العائلة...");
 const result=await db.from("people")
  .select("*")
  .eq("family_id",family)
  .order("name");

 if(result.error){
  setStatus("تعذر تحميل البيانات: "+result.error.message);
  return;
 }

 people=result.data||[];
 updateParentOptions();
 await renderTree();
 setStatus(people.length?"تم تحميل الشجرة بنجاح.":"لا توجد أسماء مضافة حتى الآن.",true);
}

function updateParentOptions(){
 const select=el("parentSelect");
 const previous=select.value;
 select.innerHTML='<option value="">بدون أب (فرد رئيسي)</option>';

 people.forEach(person=>{
  if(editingId===person.id)return;
  const option=document.createElement("option");
  option.value=person.id;
  option.textContent=person.name;
  select.appendChild(option);
 });

 if(previous&&[...select.options].some(o=>o.value===previous)){
  select.value=previous;
 }
}

function resetForm(){
 editingId=null;
 el("personName").value="";
 el("personInfo").value="";
 el("personPhoto").value="";
 el("parentSelect").value="";
 el("formTitle").textContent="إضافة فرد جديد";
 el("savePerson").textContent="إضافة الفرد";
 el("cancelEdit").classList.add("hidden");
 updateParentOptions();
}

el("cancelEdit").addEventListener("click",resetForm);

function isDescendant(parentId,targetId,visited=new Set()){
 if(!parentId||visited.has(parentId))return false;
 if(parentId===targetId)return true;
 visited.add(parentId);
 const children=people.filter(p=>p.parent_id===parentId);
 return children.some(child=>isDescendant(child.id,targetId,visited));
}

async function savePerson(){
 if(role!=="admin")return alert("ليس لديك صلاحية التعديل.");

 const name=el("personName").value.trim();
 const info=el("personInfo").value.trim();
 const parentId=el("parentSelect").value||null;
 const file=el("personPhoto").files[0];

 if(!name)return alert("اكتب اسم الشخص.");

 if(editingId&&parentId&&isDescendant(parentId,editingId)){
  return alert("لا يمكن ربط الشخص بأحد أحفاده.");
 }

 const button=el("savePerson");
 button.disabled=true;
 button.textContent="جارٍ الحفظ...";

 let uploadedPath=null;
 let oldPhoto=null;

 try{
  const row={
   family_id:family,
   parent_id:parentId,
   name:name,
   info:info
  };

  if(editingId){
   const old=people.find(p=>p.id===editingId);
   oldPhoto=old?.photo_path||null;
  }

  if(file){
   if(!file.type.startsWith("image/"))throw new Error("اختر ملف صورة صالحًا.");
   if(file.size>5*1024*1024)throw new Error("حجم الصورة يجب ألا يتجاوز 5 ميجابايت.");

   const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"jpg");
   uploadedPath=family+"/"+crypto.randomUUID()+"."+ext;

   const upload=await db.storage.from(BUCKET).upload(uploadedPath,file);
   if(upload.error)throw upload.error;
   row.photo_path=uploadedPath;
  }

  let result;

  if(editingId){
   result=await db.from("people").update(row).eq("id",editingId);
  }else{
   result=await db.from("people").insert(row);
  }

  if(result.error)throw result.error;

  if(file&&oldPhoto){
   await db.storage.from(BUCKET).remove([oldPhoto]);
  }

  resetForm();
  await loadPeople();

 }catch(error){
  if(uploadedPath){
   await db.storage.from(BUCKET).remove([uploadedPath]);
  }
  alert("تعذر الحفظ: "+(error.message||"خطأ غير معروف"));
 }finally{
  button.disabled=false;
  button.textContent=editingId?"حفظ التعديل":"إضافة الفرد";
 }
}

el("savePerson").addEventListener("click",savePerson);

function startEdit(id){
 if(role!=="admin")return;
 const person=people.find(p=>p.id===id);
 if(!person)return;

 editingId=id;
 el("personName").value=person.name;
 el("personInfo").value=person.info||"";
 el("personPhoto").value="";
 updateParentOptions();
 el("parentSelect").value=person.parent_id||"";
 el("formTitle").textContent="تعديل بيانات "+person.name;
 el("savePerson").textContent="حفظ التعديل";
 el("cancelEdit").classList.remove("hidden");
 el("personName").scrollIntoView({behavior:"smooth",block:"center"});
}

async function deletePerson(id){
 if(role!=="admin")return;
 const person=people.find(p=>p.id===id);
 if(!person)return;

 if(people.some(p=>p.parent_id===id)){
  alert("لا يمكن حذف هذا الشخص قبل معالجة بيانات الأبناء المرتبطين به.");
  return;
 }

 if(!confirm("هل تريد حذف "+person.name+"؟"))return;

 const result=await db.from("people").delete().eq("id",id);

 if(result.error){
  alert("تعذر الحذف: "+result.error.message);
  return;
 }

 if(person.photo_path){
  await db.storage.from(BUCKET).remove([person.photo_path]);
 }

 await loadPeople();
}

function matchesSearch(person,query){
 return (person.name||"").toLowerCase().includes(query)||
  (person.info||"").toLowerCase().includes(query);
}

function branchMatches(person,query,visited=new Set()){
 if(visited.has(person.id))return false;
 visited.add(person.id);
 if(matchesSearch(person,query))return true;
 return people
  .filter(p=>p.parent_id===person.id)
  .some(child=>branchMatches(child,query,new Set(visited)));
}

async function renderTree(){
 const current=++renderNumber;
 const tree=el("tree");
 const query=el("search").value.trim().toLowerCase();
 tree.innerHTML="";

 if(!people.length){
  tree.textContent="لا توجد أسماء مضافة لهذه العائلة حتى الآن.";
  return;
 }

 async function draw(parentId,container,level){
  const members=people.filter(p=>(p.parent_id||null)===parentId);

  for(const person of members){
   if(query&&!branchMatches(person,query))continue;
   if(current!==renderNumber)return;

   const card=document.createElement("div");
   card.className="person";
   card.style.marginRight=(level*12)+"px";

   if(person.photo_path){
    const photo=await db.storage.from(BUCKET)
     .createSignedUrl(person.photo_path,3600);

    if(current!==renderNumber)return;

    if(photo.data?.signedUrl){
     const img=document.createElement("img");
     img.src=photo.data.signedUrl;
     img.alt="صورة "+person.name;
     card.appendChild(img);
    }
   }

   const title=document.createElement("strong");
   title.textContent=person.name;
   card.appendChild(title);

   if(person.info){
    const info=document.createElement("p");
    info.textContent=person.info;
    card.appendChild(info);
   }

   if(role==="admin"){
    const actions=document.createElement("div");
    actions.className="actions";

    const edit=document.createElement("button");
    edit.className="alt";
    edit.textContent="تعديل";
    edit.addEventListener("click",()=>startEdit(person.id));

    const del=document.createElement("button");
    del.className="danger";
    del.textContent="حذف";
    del.addEventListener("click",()=>deletePerson(person.id));

    actions.append(edit,del);
    card.appendChild(actions);
   }

   container.appendChild(card);

   const children=people.filter(p=>p.parent_id===person.id);
   if(children.length){
    const childBox=document.createElement("div");
    childBox.className="children";
    container.appendChild(childBox);
    await draw(person.id,childBox,level+1);
   }
  }
 }

 await draw(null,tree,0);

 if(current===renderNumber&&!tree.innerHTML){
  tree.textContent="لا توجد نتائج مطابقة للبحث.";
 }
}

el("search").addEventListener("input",renderTree);

function subscribeRealtime(){
 if(realtimeChannel){
  db.removeChannel(realtimeChannel);
  realtimeChannel=null;
 }

 realtimeChannel=db.channel("family-tree-live")
  .on("postgres_changes",{
   event:"*",
   schema:"public",
   table:"people"
  },()=>{
   loadPeople();
  })
  .subscribe();
}

</script>
</body>
</html>
